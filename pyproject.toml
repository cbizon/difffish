[project]
name = "difffish"
version = "0.1.0"
description = "Compare vision-model transcriptions of WCS fish field notes with LangGraph"
readme = "README.md"
authors = [
    { name = "Chris Bizon", email = "bizon@renci.org" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.13",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
difffish = "difffish.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls the model endpoint (set DIFFFISH_INTEGRATION=1)"]
